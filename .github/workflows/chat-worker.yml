# Deploys the chat server in ./worker to Cloudflare Workers (free plan), so the static GitHub Pages site can chat.
# Skips itself until the secrets below exist, so it never turns your repo red. See worker/README.md.
#
# Repo → Settings → Secrets and variables → Actions → Secrets:
#   CLOUDFLARE_API_TOKEN    Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare dashboard → Workers & Pages → Account ID (right-hand side)
#   PETFOLIO_GROQ_API_KEY   your Groq key (stored as a secret on the Worker; never in the repo)
name: Deploy chat server (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/chat-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PETFOLIO_GROQ_API_KEY: ${{ secrets.PETFOLIO_GROQ_API_KEY }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping the chat server deploy (see worker/README.md)."
          fi

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci --no-audit --no-fund

      - name: Test
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm test

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

      # After the deploy, so the Worker exists. Re-run any time you rotate the key.
      - name: Set the API key secret on the Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.PETFOLIO_GROQ_API_KEY != ''
        run: printf '%s' "$PETFOLIO_GROQ_API_KEY" | npx wrangler secret put PETFOLIO_GROQ_API_KEY
