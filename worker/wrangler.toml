# Petfolio chat server on Cloudflare Workers (free plan: 100,000 requests/day).
# Deploy: `npx wrangler deploy` here, or let .github/workflows/chat-worker.yml do it. See README.md.
name = "petfolio-chat"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Websites allowed to call this server from a browser (origin only: no path, no trailing slash).
# Comma-separated, e.g. "https://you.github.io,https://example.com"
PETFOLIO_ALLOWED_ORIGINS = "https://andrew-velox.github.io"
# PETFOLIO_MODEL = "openai/gpt-oss-20b"   # optional: override the default model

# The API key is a SECRET, never put it in this file:
#   npx wrangler secret put PETFOLIO_GROQ_API_KEY
